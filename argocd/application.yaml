apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kutt
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/emilakesofficial/url-shortener-app.git
      targetRevision: main
      path: helm/kutt
      helm:
        valueFiles:
          - values-prod.yaml
          - $values/kutt/values-prod.yaml
    - repoURL: https://github.com/emilakesofficial/url-shortener-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      